services:
  ollama:
    image: ollama/ollama
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11435:11434"

  app:
    build: .
    ports:
      - "8501:8501"
    environment:
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - ollama

volumes:
  ollama_data:
